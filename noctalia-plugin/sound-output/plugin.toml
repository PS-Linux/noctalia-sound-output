# Volume button with an output picker.
# Shows the volume like the built-in widget; right click it for a popup to
# switch the sound output, left click it for Noctalia's audio panel.
# The work is done by ~/.local/bin/sound-output.

id = "ps/sound-output"
name = "Sound Output"
version = "1.0.0"
plugin_api = 43
author = "ps"
license = "MIT"
dependencies = ["pactl", "jq"]
tags = ["audio", "volume"]
icon = "volume"
description = "Volume button whose right-click popup switches the sound output."

[[widget]]
id = "button"
entry = "widget.luau"

# Same as the built-in volume widget, except that right click is onRightClick
# in widget.luau. Scroll goes through Noctalia so its volume OSD still shows.
[widget.actions]
left = "panel-toggle control-center audio"
scroll_up = "volume-up 5%"
scroll_down = "volume-down 5%"

[[panel]]
id = "popup"
entry = "popup.luau"
# Attached panels can only align to an end of the bar, not to a widget. The
# icon sits near the right end, so align there and make the popup wide enough
# to sit over it.
width = 380
height = "content"
max_height = 420
placement = "attached"
position = "bottom_right"
dismiss_on_outside_click = true
