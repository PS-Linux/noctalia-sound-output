# Volume button with an output picker.
# Shows the volume like the built-in widget; hover it for a popup to switch the
# sound output, click it for Noctalia's audio panel.
# The work is done by ~/.local/bin/sound-output.

id = "ps/sound-output"
name = "Sound Output"
version = "1.0.0"
plugin_api = 43
author = "ps"
license = "MIT"
dependencies = ["pactl", "jq"]
tags = ["audio", "volume"]
icon = "volume"
description = "Volume button whose hover popup switches the sound output."

[[widget]]
id = "button"
entry = "widget.luau"

# Same gestures as the built-in volume widget; scroll and right click go
# through Noctalia so its volume OSD still shows. Left click is onClick in
# widget.luau, which also keeps the hover popup from reopening.
[widget.actions]
scroll_up = "volume-up 1%"
scroll_down = "volume-down 1%"
right = "volume-mute"

[[panel]]
id = "popup"
entry = "popup.luau"
# Attached panels can only align to an end of the bar, not to a widget. The
# icon sits near the right end, so align there and make the popup wide enough
# to cover it: moving the pointer straight up from the icon lands inside.
width = 380
height = "content"
max_height = 420
placement = "attached"
position = "bottom_right"
keyboard_focus = "none"
dismiss_on_outside_click = false
